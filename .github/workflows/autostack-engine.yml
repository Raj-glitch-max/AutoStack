name: AutoStack Engine

on:
  repository_dispatch:
    types: [provision-infra]

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event.client_payload.role_arn }}
          aws-region: ${{ github.event.client_payload.region }}
          role-external-id: ${{ github.event.client_payload.org_id }}
          role-session-name: AutoStackEngineSession

      - name: Setup Tools
        run: |
          # Install eksctl
          ARCH=amd64
          PLATFORM=$(uname -s)_$ARCH
          curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$PLATFORM.tar.gz"
          tar -xzf eksctl_$PLATFORM.tar.gz -C /tmp && rm eksctl_$PLATFORM.tar.gz
          sudo mv /tmp/eksctl /usr/local/bin

          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Update Stage Provisioning VPC
        run: |
          curl -X PATCH "${{ github.event.client_payload.supabase_url }}/rest/v1/projects?id=eq.${{ github.event.client_payload.project_id }}" \
            -H "apikey: ${{ github.event.client_payload.supabase_anon_key }}" \
            -H "Authorization: Bearer ${{ github.event.client_payload.token }}" \
            -H "Content-Type: application/json" \
            -d '{"provisioning_status": "provisioning", "die_stage": "vpc-creation"}'

      - name: Provision Infrastructure
        id: provision
        run: |
          PROJECT_ID="${{ github.event.client_payload.project_id }}"
          REGION="${{ github.event.client_payload.region }}"
          
          echo "Provisioning EKS Cluster for project $PROJECT_ID in $REGION..."
          
          # Use eksctl to create a real EKS cluster. This provisions the VPC, Subnets, NatGateways, and NodeGroups.
          # We tag the cluster itself so infra-teardown can find it.
          eksctl create cluster \
            --name autostack-$PROJECT_ID \
            --region $REGION \
            --vpc-cidr 10.0.0.0/16 \
            --nodegroup-name standard-workers \
            --node-type t3.medium \
            --nodes 2 \
            --tags autostack:project_id=$PROJECT_ID,autostack:environment=production

          # Get the VPC ID created by eksctl
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=eksctl-autostack-$PROJECT_ID-cluster/VPC --region $REGION --query 'Vpcs[0].VpcId' --output text)
          
          # Update DB with VPC ID and move to agent installation stage
          curl -X PATCH "${{ github.event.client_payload.supabase_url }}/rest/v1/projects?id=eq.$PROJECT_ID" \
            -H "apikey: ${{ github.event.client_payload.supabase_anon_key }}" \
            -H "Authorization: Bearer ${{ github.event.client_payload.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"vpc_id\": \"$VPC_ID\", \"die_stage\": \"agent-installation\"}"

          # Install AutoStack Go Agent via Helm
          # Generate a token for the agent
          AGENT_TOKEN=$(openssl rand -hex 32)
          
          curl -X POST "${{ github.event.client_payload.supabase_url }}/functions/v1/connect-cluster" \
            -H "Authorization: Bearer ${{ github.event.client_payload.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"project_id\": \"$PROJECT_ID\", \"token\": \"$AGENT_TOKEN\"}"

          helm upgrade --install autostack-agent oci://ghcr.io/raj-glitch-max/autostack-agent-chart \
            --namespace autostack-system \
            --create-namespace \
            --set agent.token=$AGENT_TOKEN \
            --set agent.projectId=$PROJECT_ID \
            --set agent.supabaseUrl=${{ github.event.client_payload.supabase_url }} \
            --set agent.supabaseAnonKey=${{ github.event.client_payload.supabase_anon_key }}
          
          echo "VPC Created: $VPC_ID"
          echo "eks_cluster_arn=arn:aws:eks:$REGION:$(aws sts get-caller-identity --query Account --output text):cluster/autostack-$PROJECT_ID" >> $GITHUB_OUTPUT

      - name: Finalize Status
        run: |
          curl -X PATCH "${{ github.event.client_payload.supabase_url }}/rest/v1/projects?id=eq.${{ github.event.client_payload.project_id }}" \
            -H "apikey: ${{ github.event.client_payload.supabase_anon_key }}" \
            -H "Authorization: Bearer ${{ github.event.client_payload.token }}" \
            -H "Content-Type: application/json" \
            -d '{"provisioning_status": "live", "die_stage": "complete", "live_url": "https://${{ github.event.client_payload.project_id }}.autostack.app"}'
